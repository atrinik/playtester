name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Playtester validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate repository seed
        shell: bash
        run: |
          empty_tree=$(git hash-object -t tree /dev/null)
          git diff --check "${empty_tree}" HEAD
          test -s LICENSE
          test -s README.md
          test -s PROVENANCE.md
          test -s SECURITY.md
          if git ls-files | grep -E '(^|/)(credentials\.sh|.*\.sqlite3|runtime_state.*|.*:Zone\.Identifier)$'; then
            echo "mutable or secret-bearing file is tracked" >&2
            exit 1
          fi
          if git ls-files | grep '^atrinik_bot/'; then
            echo "held prototype source was imported without updating the provenance gate" >&2
            exit 1
          fi
