name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Playtester validation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select the minimum supported Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install protocol dependency
        run: >-
          python3 -m pip install
          'atrinik-protocol @
          https://github.com/atrinik/legacy-protocol/releases/download/v1.0.9/atrinik_protocol-1.0.9-py3-none-any.whl#sha256=78954264fa49ac8736dbfc7a72669f619e0202e6ae15445a0b0839aa8f30eb8a'

      - name: Build and test playtester
        env:
          ATRINIK_PLAYTESTER_CACHE: ${{ runner.temp }}/atrinik-playtester-cache
          PYTHONPATH: ${{ github.workspace }}/build/playtester/python
        run: |
          cmake -S . -B build/playtester -G Ninja -DBUILD_TESTING=ON
          cmake --build build/playtester --parallel
          ctest --test-dir build/playtester --output-on-failure
          python3 -m atrinik_bot dependencies --json
          python3 -m atrinik_bot doctor --json
          python3 - <<'PY'
          import unittest
          from atrinik_bot.compatibility import (
              configure_cached_bundle,
              default_cache_root,
              load_lock,
          )

          configure_cached_bundle(default_cache_root(), load_lock())
          result = unittest.TextTestRunner(verbosity=2).run(
              unittest.defaultTestLoader.loadTestsFromName("atrinik_bot.test_bot")
          )
          raise SystemExit(not result.wasSuccessful())
          PY

      - name: Build, install, and smoke-test wheel from a clean directory
        env:
          ATRINIK_PLAYTESTER_CACHE: ${{ runner.temp }}/atrinik-playtester-cache
        run: |
          python3 -m pip wheel --no-deps --wheel-dir build/dist .
          unzip -l build/dist/*.whl | grep -q 'licenses/THIRD_PARTY_NOTICES.md'
          unzip -l build/dist/*.whl | grep -q 'atrinik_bot/dependencies.lock.json'
          python3 -m venv "${RUNNER_TEMP}/atrinik-playtester-wheel"
          "${RUNNER_TEMP}/atrinik-playtester-wheel/bin/pip" install build/dist/*.whl
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/atrinik-playtester-wheel/bin/python" \
            -m atrinik_bot dependencies --offline --json
          "${RUNNER_TEMP}/atrinik-playtester-wheel/bin/python" \
            -m atrinik_bot doctor --json
          "${RUNNER_TEMP}/atrinik-playtester-wheel/bin/python" \
            -m atrinik_bot --help

      - name: Validate repository boundaries
        shell: bash
        run: |
          python3 -W error -m compileall -q -f .
          empty_tree=$(git hash-object -t tree /dev/null)
          git diff --check "${empty_tree}" HEAD
          test -s LICENSE
          test -s PROVENANCE.md
          test -s THIRD_PARTY_NOTICES.md
          test -s dependencies.lock.json
          if git ls-files | grep -E '(^|/)(credentials\.sh|.*\.sqlite3|runtime_state.*|.*:Zone\.Identifier)$'; then
            echo "mutable or secret-bearing file is tracked" >&2
            exit 1
          fi
