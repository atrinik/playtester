name: Pull Request Policy

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened
  # The title and body were validated on the pull request before it was
  # queued, and a merge group carries no pull-request metadata. The job still
  # runs so the required check reports on the queued merge result.
  merge_group:

permissions:
  contents: read

jobs:
  conventional-title:
    name: Conventional PR title
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check out trusted policy
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Validate pull request metadata
        if: github.event_name == 'pull_request_target'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 .github/scripts/check_pr_metadata.py

      - name: Accept metadata validated before queueing
        if: github.event_name == 'merge_group'
        run: echo "Pull request metadata was validated before the merge queue."
