[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "atrinik-playtester"
version = "0.1.0"
description = "Autonomous headless end-to-end playtester for Atrinik"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
maintainers = [
  {name = "Zoey Rose"},
]
# The Classic protocol wheel is installed from dependencies.lock.json by
# scripts/install_locked_protocol.py so metadata and CI share one input.
dependencies = ["aioquic>=1.2"]

[project.scripts]
atrinik-playtester = "atrinik_bot.cli:main"
atrinik-bot = "atrinik_bot.cli:main"

[project.urls]
Homepage = "https://github.com/atrinik/playtester"
Issues = "https://github.com/atrinik/playtester/issues"
Repository = "https://github.com/atrinik/playtester.git"

[tool.scikit-build]
cmake.source-dir = "."
wheel.packages = []
