[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "atrinik-playtester"
version = "0.1.0"
description = "Autonomous headless end-to-end playtester for Atrinik"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
  {name = "Zoey Rose"},
]
dependencies = [
  "atrinik-protocol @ https://github.com/atrinik/legacy-protocol/releases/download/v1.0.9/atrinik_protocol-1.0.9-py3-none-any.whl#sha256=78954264fa49ac8736dbfc7a72669f619e0202e6ae15445a0b0839aa8f30eb8a",
]

[project.optional-dependencies]
quic = ["aioquic>=1.2"]

[project.scripts]
atrinik-playtester = "atrinik_bot.cli:main"
atrinik-bot = "atrinik_bot.cli:main"

[project.urls]
Homepage = "https://github.com/atrinik/playtester"
Issues = "https://github.com/atrinik/playtester/issues"
Repository = "https://github.com/atrinik/playtester.git"

[tool.scikit-build]
cmake.source-dir = "."
wheel.packages = []
