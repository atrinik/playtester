[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "atrinik-bot"
version = "0.1.0"
description = "Headless Atrinik gameplay client and automation engine"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-2.0-or-later"
dependencies = [
  "atrinik-protocol @ https://github.com/atrinik/protocol/releases/download/v1.0.9/atrinik_protocol-1.0.9-py3-none-any.whl#sha256=78954264fa49ac8736dbfc7a72669f619e0202e6ae15445a0b0839aa8f30eb8a",
]

[project.optional-dependencies]
quic = ["aioquic>=1.2"]

[project.scripts]
atrinik-bot = "atrinik_bot.cli:main"

[tool.scikit-build]
cmake.source-dir = "."
wheel.packages = []
